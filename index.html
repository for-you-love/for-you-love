 <!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💗</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
overflow:hidden;
background:linear-gradient(135deg,#ff9fc5,#ffd6e5,#ffb5d0);
}

.card{
width:90%;
max-width:390px;
padding:32px 23px;
text-align:center;
background:rgba(255,255,255,.9);
backdrop-filter:blur(15px);
border-radius:30px;
box-shadow:0 20px 70px rgba(180,40,100,.28);
z-index:10;
animation:in .7s ease;
}

@keyframes in{
from{opacity:0;transform:translateY(25px) scale(.95)}
to{opacity:1;transform:translateY(0) scale(1)}
}

.heart{
font-size:65px;
animation:beat 1.3s infinite;
}

@keyframes beat{
50%{transform:scale(1.18)}
}

h1{
color:#d93668;
font-size:27px;
}

.message{
color:#555;
font-size:17px;
line-height:2;
min-height:120px;
}

input{
width:90%;
padding:14px;
margin:8px 0;
border:2px solid #ffd0df;
border-radius:15px;
outline:none;
font-size:16px;
text-align:center;
}

button{
border:0;
padding:15px 28px;
border-radius:50px;
background:linear-gradient(135deg,#ff4f83,#d93668);
color:white;
font-size:16px;
font-weight:bold;
box-shadow:0 8px 25px rgba(217,54,104,.3);
margin-top:10px;
}

.step{
margin-top:20px;
color:#aaa;
font-size:13px;
}

#love,#final{
display:none;
}

#secret{
display:none;
margin-top:25px;
font-size:18px;
line-height:2;
color:#555;
}

.float{
position:fixed;
bottom:-60px;
font-size:25px;
animation:up 8s linear infinite;
opacity:0;
}

.a1{left:10%}
.a2{left:30%;animation-delay:2s}
.a3{left:55%;animation-delay:4s}
.a4{left:80%;animation-delay:1s}

@keyframes up{
0%{transform:translateY(0);opacity:0}
20%{opacity:1}
100%{transform:translateY(-115vh) rotate(360deg);opacity:0}
}
</style>
</head>

<body>

<div class="float a1">💗</div>
<div class="float a2">💕</div>
<div class="float a3">💖</div>
<div class="float a4">🌸</div>


<!-- NAME PAGE -->

<div class="card" id="namePage">

<div class="heart">💗</div>

<h1>သီးသန့်စာလေး 💌</h1>

<p class="message">
ဒီစာမျက်နှာလေးကို<br>
ဘယ်သူ့အတွက်လဲ သိချင်လား? 🌷
</p>

<input id="myName" placeholder="မင်းနာမည် 💗">

<input id="crushName" placeholder="Crush နာမည် 💕">

<br>

<button onclick="startLove()">
💌 စတင်မယ်
</button>

</div>


<!-- LOVE PAGE -->

<div class="card" id="love">

<div class="heart" id="heart">💗</div>

<h1 id="title">အဆင့် ၁ 💗</h1>

<div class="message" id="message">
ဒီစာမျက်နှာလေးက<br>
မင်းအတွက် သီးသန့်လုပ်ထားတာပါ 🌷
</div>

<button id="button" onclick="nextStep()">
💌 ဆက်ကြည့်မယ်
</button>

<div class="step" id="step">1 / 5</div>

</div>


<!-- FINAL PAGE -->

<div class="card" id="final">

<div class="heart" id="surpriseHeart">💗</div>

<h1 id="finalTitle">
မင်းအတွက်ပါ 🌷
</h1>

<p class="message">
ဒီစာလေးကို ဖတ်ပေးလို့<br>
ကျေးဇူးတင်ပါတယ် 🥹<br><br>

မင်းပြုံးမိခဲ့ရင်<br>
ဒီစာမျက်နှာလေးရဲ့ ရည်ရွယ်ချက် ပြည့်ပါပြီ။ 💕
</p>

<button onclick="showSurprise()">
💌 သီးသန့်စာလေးဖွင့်မယ်
</button>

<div id="secret"></div>

</div>


<script>

let step=1;
let myName="";
let crushName="";


function startLove(){

myName=document.getElementById("myName").value.trim();
crushName=document.getElementById("crushName").value.trim();

if(myName===""){
myName="ငါ";
}

if(crushName===""){
crushName="မင်း";
}

document.getElementById("namePage").style.display="none";
document.getElementById("love").style.display="block";

document.getElementById("message").innerHTML=
crushName+" အတွက်<br>ဒီစာမျက်နှာလေးကို "+myName+" က သီးသန့်လုပ်ထားတာပါ 🌷";

}


function nextStep(){

step++;

if(step===2){

document.getElementById("heart").innerHTML="🌸";
document.getElementById("title").innerHTML="အဆင့် ၂ 🌸";

document.getElementById("message").innerHTML=
crushName+" ကို<br>ပြောချင်တဲ့ စာလေးတစ်ခုရှိတယ် 🤭";

}

else if(step===3){

document.getElementById("heart").innerHTML="💕";
document.getElementById("title").innerHTML="အဆင့် ၃ 💕";

document.getElementById("message").innerHTML=
crushName+" နဲ့ စကားပြောရတဲ့အချိန်တိုင်း<br>ပျော်မိတယ်။";

}

else if(step===4){

document.getElementById("heart").innerHTML="💖";
document.getElementById("title").innerHTML="အဆင့် ၄ 💖";

document.getElementById("message").innerHTML=
"တကယ်တော့…<br>"+crushName+" ကို သဘောကျနေမိပြီထင်တယ် 🙈";

}

else if(step===5){

document.getElementById("heart").innerHTML="🥹";
document.getElementById("title").innerHTML="အဆင့် ၅ 💗";

document.getElementById("message").innerHTML=
"နောက်ဆုံးတစ်ခုလေးပဲ…<br>"+crushName+" အတွက် "+myName+" ရေးထားတာပါ 💗";

document.getElementById("button").innerHTML=
"💌 ဖွင့်ကြည့်မယ်";

}

else{

document.getElementById("love").style.display="none";
document.getElementById("final").style.display="block";

document.getElementById("finalTitle").innerHTML=
crushName+" အတွက်ပါ 🌷";

}

document.getElementById("step").innerHTML=
step+" / 5";

}


function showSurprise(){

document.getElementById("secret").style.display="block";

document.getElementById("secret").innerHTML=
crushName+" ရေ 💕<br><br>"+
"ဒီစာမျက်နှာလေးကို "+myName+
" က မင်းအတွက် သီးသန့်လုပ်ထားတာပါ။<br><br>"+
"မင်းပြုံးမိရင် ငါလည်း ပျော်ပြီ 🌷<br><br>"+
"💗 💕 💖 💕 💗";


document.getElementById("surpriseHeart").innerHTML="💖💖💖";


for(let i=0;i<25;i++){

let heart=document.createElement("div");

heart.innerHTML=
["💗","💕","💖","🌸","✨"]
[Math.floor(Math.random()*5)];

heart.style.position="fixed";
heart.style.left=Math.random()*100+"%";
heart.style.bottom="20px";
heart.style.fontSize=(18+Math.random()*25)+"px";
heart.style.zIndex="999";

document.body.appendChild(heart);

heart.animate(
[
{transform:"translateY(0)",opacity:1},
{transform:"translateY(-100vh)",opacity:0}
],
{
duration:2500+Math.random()*1500,
easing:"ease-out"
}
);

setTimeout(function(){
heart.remove();
},4500);

}

}

</script>

</body>
</html>
